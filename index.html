<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiến độ phát triển game</title>
  <meta name="description" content="Báo cáo tiến độ các dự án game của team">
  <meta name="theme-color" content="#161a26">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161a26'/%3E%3Crect x='6' y='17' width='5' height='9' rx='1' fill='%2334d399'/%3E%3Crect x='13.5' y='11' width='5' height='15' rx='1' fill='%23fb923c'/%3E%3Crect x='21' y='6' width='5' height='20' rx='1' fill='%23a5b4fc'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#app">Bỏ qua, đến nội dung chính</a>

  <header class="hero">
    <div class="wrap">
      <h1 id="title"></h1>
      <p class="updated">Cập nhật lần cuối <strong id="updated"></strong></p>
      <div id="board" class="board" aria-label="Tổng quan các game"></div>
    </div>
  </header>

  <div class="topbar" id="topbar">
    <div class="topbar-row">
      <nav class="tabs" id="tabs" aria-label="Điều hướng mục"></nav>
      <button class="btn ghost top-edit" id="enter-edit" type="button" aria-pressed="false">Chỉnh sửa</button>
    </div>
    <div class="filterbar" id="filterbar" role="search" aria-label="Lọc game">
      <input id="f-q" type="search" placeholder="Tìm game theo tên, thể loại, nền tảng…" aria-label="Tìm game" autocomplete="off">
      <div class="seg" id="f-sec" role="group" aria-label="Lọc theo mục"></div>
      <select id="f-genre" aria-label="Lọc theo thể loại"><option value="">Mọi thể loại</option></select>
      <span class="f-count" id="f-count" aria-live="polite"></span>
      <button class="link-btn" id="f-clear" type="button" hidden>Xóa lọc</button>
    </div>
  </div>

  <main class="wrap" id="app" tabindex="-1">
    <noscript><p class="empty">Trang cần bật JavaScript để hiển thị nội dung.</p></noscript>
  </main>

  <div class="foot-space"></div>

  <button class="send-pill" id="send" hidden></button>
  <button class="to-top" id="to-top" type="button" aria-label="Lên đầu trang" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="editbar" id="editbar" hidden>
    <p><strong>Đang chỉnh sửa.</strong> Sửa chữ, ảnh, link ngay trên trang, kéo game sang mục khác bằng nút ⠿. Thay đổi <strong>tự lưu</strong> và mọi người thấy ngay.
      <span class="dirty" id="dirty" role="status" aria-live="polite" hidden></span></p>
    <div class="editbar-actions">
      <button class="btn ghost" id="test-mail" type="button">Gửi email thử</button>
      <button class="btn ghost" id="export" type="button">Tải bản sao lưu</button>
      <button class="btn ghost" id="import" type="button">Nhập bản sao lưu</button>
      <button class="btn" id="exit-edit" type="button">Xong</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>

  <dialog class="gh-dialog" id="ver-dialog" aria-labelledby="ver-title">
    <form method="dialog">
      <h2 id="ver-title">Tạo phiên bản mới</h2>
      <p>Game: <strong id="ver-game"></strong>. Thông tin hiện tại của phiên bản trước sẽ được lưu lại nguyên trạng để xem sau.</p>
      <label for="ver-num">Số phiên bản</label>
      <input id="ver-num" type="text" maxlength="40" placeholder="Ví dụ v0.7" autocomplete="off">
      <label for="ver-notes">Bản vá, thay đổi (không bắt buộc)</label>
      <textarea id="ver-notes" rows="5" maxlength="2000" placeholder="- Thêm …&#10;- Sửa lỗi …"></textarea>
      <div class="gh-actions">
        <button class="btn" id="ver-ok" type="submit">Tạo phiên bản</button>
        <button class="btn ghost" id="ver-cancel" type="button">Hủy</button>
      </div>
    </form>
  </dialog>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh" hidden>
    <button class="lb-close" aria-label="Đóng">✕</button>
    <button class="lb-nav lb-prev" aria-label="Ảnh trước">‹</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button class="lb-nav lb-next" aria-label="Ảnh sau">›</button>
  </div>

  <button class="annot-chip" id="annot-chip" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>Nhận xét</span>
  </button>
  <div class="annot-pop" id="annot-pop" role="dialog" aria-label="Nhận xét về phần này" hidden></div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button id="toast-undo" hidden>Hoàn tác</button>
  </div>

  <!-- Nạp data.js và app.js kèm mã thời gian để luôn lấy bản mới nhất (tránh bản cũ nằm trong bộ nhớ đệm
       làm trang lệch phiên bản và trắng trang sau mỗi lần cập nhật code) -->
  <script>
    (function () {
      var v = Date.now();
      ["data.js?v=" + v, "app.js?v=" + v].forEach(function (src) {
        var s = document.createElement("script");
        s.src = src;
        s.async = false; // giữ đúng thứ tự: data.js chạy trước app.js
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
